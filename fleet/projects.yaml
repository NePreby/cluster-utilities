# Which host owns each project — the "one repo, one machine" rule, written down.
#
#   <dir name>: [<host id>, ...]     host ids come from fleet/hosts.yaml
#   <dir name>: [*]                  expected on every host (infra)
#
# A project lives on exactly ONE host unless it's infra that every machine needs ([*]), or it's
# mid-migration (listed on two hosts, marked TEMP). `[?]` = not decided yet. bin/fleet-audit flags:
#   UNLISTED  — a dir on some host that isn't in this file
#   MISPLACED — a dir on a host that isn't in its list (stale copy, or the list is wrong)
#   UNDECIDED — listed as [?]
# Keys are directory basenames (repos are matched by dir name, not remote — e.g. the laptop's
# deprecated-epilepsy is a separate checkout of the same remote as epilepsy).
#
# Keep to one `name: [a, b]` per line — fleet-audit reads this with awk.
# Default for new research work: lab8 (lkj008-psy), the main research box. Other labN boxes take work as it is assigned.

projects:
  # --- infra: on every host ---
  cluster-utilities: [*]
  agent-utilities: [*]
  system-utilities: [*]

  # --- laptop: desktop, personal, needs a display/GPU ---
  linux-config: [laptop]
  kirby: [laptop]
  genome-pgs: [laptop]
  study-permit: [laptop]
  os-debugs: [laptop, lab8]

  # --- lab: research ---
  epilepsy: [lab8]                   # data on lab8 since 2026-10-24, checksum-verified (paths: epilepsy README); laptop checkout is code-only
  deprecated-epilepsy: [laptop]      # TEMP: 67 GB of ignored data/derivatives to migrate to lab8, then delete
  speech-representations: [lab8]
  containerized-red-teaming: [lab8]
  crt-pr130: [lab8]
  gemini-agy-investigation-P88aiW: [lab8]
  gemini-agy-pr: [lab8]
  aaai-overclaiming-paper: [lab8]
  aaai-overclaiming-paper-arxiv: [lab8]
  overclaiming-paper-arxiv: [lab8]
  overclaiming-paper-iclr: [lab8]
  overclaiming-iclr-todo-snapshot-sXSfhz: [lab8]
  clean-neurons: [lab8]
  questionnaire-bias: [lab8]
  pkb: [lab8]
  pkb_incoming: [lab8]
  shareables: [lab8]
  handoffs: [lab8]
  amica-stuff: [lab8]
  speech-representations-lineage-report: [lab8]
  interp: [lab8]
  gbfb-port: [lab8]
  complex-seizures: [lab8]
  llm-therapy: [lab8]

  # --- undecided: on both hosts today, on different branches/commits ---
  neurodags: [?]
  neurodags-private: [?]
  cocofeats: [?]
  coco-pipe: [?]
  galleria: [?]
  yjmantilla.github.io: [?]
