# Which host owns each project — the "one repo, one machine" rule, written down.
#
#   <dir name>: [<host id>, ...]     host ids come from fleet/hosts.yaml
#   <dir name>: [*]                  expected on every host (infra)
#
# A project lives on exactly ONE host unless it's infra that every machine needs ([*]), or it's
# mid-migration (listed on two hosts, marked TEMP). Alliance clusters aren't hosts here: a clone on a
# cluster is a run-only copy, never edited (see fleet/README.md, rule 1). `[?]` = not decided yet. bin/fleet-audit flags:
#   UNLISTED  — a dir on some host that isn't in this file
#   MISPLACED — a dir on a host that isn't in its list (stale copy, or the list is wrong)
#   UNDECIDED — listed as [?]
# Keys are directory basenames (repos are matched by dir name, not remote — e.g. the laptop's
# deprecated-epilepsy is a separate checkout of the same remote as epilepsy).
#
# Keep to one `name: [a, b]` per line — fleet-audit reads this with awk.
# Default for new research work: lab8 (lkj008-psy), the main research box. Other labN boxes take work as it is assigned.

projects:
  # --- infra: on every host ---
  cluster-utilities: [*]
  agent-utilities: [*]
  system-utilities: [*]

  # --- laptop: desktop, personal, needs a display/GPU ---
  linux-config: [laptop]
  kirby: [laptop]  # dev on the laptop (katam = private yjmantilla/kirby-online; personal-files branch in git-annex). The co-op servers (coop/coop2.yorguin.foo: systemd user units coop{,2}-relay + coop{,2}-tunnel) run on lab10 from ~/kirby-private (not a repo; moved from lab8 2026-10-26; saves snapshotted into personal-files). Deploy with LAB=lab10 / --lab lab10 (the laptop's `lab` alias is lab8)
  os-debug: [*]  # since 2026-10-27: private yjmantilla/os-debug, cloned on every host; notes/YYYY-MM-DD-<host>-<topic>.md; transcripts collected on lab10 (git-annex, Drive only) with collect-transcripts.sh. Old os-debugs folders (laptop, lab8) replaced by clones

  # --- lab10: personal ---
  simgames: [lab10]  # 2026-10-26: laptop's sim-engine, bot, football, acrobots combined (full history per folder); acrobots reference files in git-annex. Laptop copies go once it's on GitHub + Drive
  youtube-audio-downloader: [lab10]  # 2026-10-26: yt-dlp audio CLI from laptop ~/code (never committed there); downloads/ in git-annex
