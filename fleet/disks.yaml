# Every internal disk in the lab fleet: what's on it, whose it is, and what we may use.
#
# Why this file exists: these workstations were reused from earlier lab members. Besides the CachyOS
# install, most of them carry old Windows installs, old Linux installs and big research datasets that
# belong to other people. That data is invisible unless you mount the partitions. Before putting
# project data or backups on a box, or formatting, mounting or fstab-ing anything, look here first:
# deciding where epilepsy goes (2026-10-25) needed exactly this inventory, and the first plan pointed at
# a "spare" 4 TB disk that turned out to be 95% full of someone else's MEG data.
#
# Source: bin/fleet-disks (read-only scan, 2026-10-25; every disk passed SMART) + lsblk for models,
# serials and UUIDs. Full per-folder reports were in cluster-utilities/fleet-disks-2026-10-25/ on the
# laptop (gitignored). Re-run `bin/fleet-disks <hosts>` after any disk change and update this file.
#
# Identify disks by `serial` and partitions by `uuid`: sdX/nvme names can change between boots, and
# labels repeat (lab8 and lab9 both have an NTFS disk labelled "Datas4To").
#
# use:
#   os-*                      this CachyOS install (boot, root+home on btrfs subvolumes, swap)
#   own-backup                the user's own backup disk (OK to use, see the note)
#   others-data               research data of other lab members: don't write, move or format without the lab's OK
#   legacy-windows*           an old Windows install (user profiles, recovery, MSR)
#   legacy-linux*             an old Linux install (home dirs of former users)
#   own-backup+others-data    the user's backups share the disk with someone else's data
# Usable space for projects today = each box's own /home (os-root+home) plus the two own-backup disks.
# hosts.yaml is the host inventory; mounts that must survive reboots are tracked in #27.

